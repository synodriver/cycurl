name: Build, test and release

on:
  pull_request:
    branches:
      - cython
  push:
    branches:
      - cython
      - bugfix/*
      - feature/*
      - release/*
      - chore/*
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Lint
        run: |
          pip install mypy ruff
          make lint

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: curl_cffi-${{ github.sha }}-sdist.zip
          path: ./dist/*.tar.gz

  bdist_native:
    name: Build wheels (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            cibw_archs: x86_64
          - name: Linux aarch64
            os: ubuntu-24.04-arm
            cibw_archs: aarch64
          - name: macOS x86_64
            os: macos-13
            cibw_archs: x86_64
          - name: macOS arm64
            os: macos-14
            cibw_archs: arm64
          - name: Windows x64
            os: windows-2022
            cibw_archs: AMD64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v3.3.1
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}

      - uses: actions/upload-artifact@v4
        with:
          name: curl_cffi-${{ github.sha }}-${{ matrix.os }}.zip
          path: ./wheelhouse/*.whl

